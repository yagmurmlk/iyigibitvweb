# İyi Gibi TV sitesi: YouTube verisini günceller ve siteyi GitHub Pages'e yayınlar.
#
# Ne zaman çalışır:
#   - Her gün 06:17 UTC (Türkiye saatiyle 09:17)
#   - Dala her kod gönderildiğinde (yalnızca yayınlar, veri çekmez)
#   - Actions sekmesinden "Run workflow" ile elle
#
# Gerekenler:
#   - Settings > Secrets and variables > Actions > YOUTUBE_API_KEY
#   - Settings > Pages > Source: GitHub Actions
name: Site

on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: ["claude/great-johnson-n9h9iv"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: YouTube verisini güncelle
        if: github.event_name != 'push'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "::warning::YOUTUBE_API_KEY tanımlı değil; veri güncellenmeden yayınlanıyor."
            exit 0
          fi
          python3 scripts/fetch_youtube.py
          python3 scripts/build_data.py

      - name: Değişiklik varsa kaydet
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- data/youtube.json assets/js/data.js; then
            echo "Yeni veri yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube.json assets/js/data.js
          git commit -m "YouTube verisi güncellendi ($(date -u +%Y-%m-%d))"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
